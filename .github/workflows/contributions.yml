name: Paneles del perfil

on:
  schedule:
    - cron: '17 5 * * *' # 00:17 en Colombia
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**']

permissions:
  contents: write

concurrency:
  group: contributions
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Regenera todo: edad (versión), meses en el equipo y el tablero.
      - run: npm ci
      - run: node scripts/build-assets.mjs
      - run: node scripts/contributions.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
      - name: Guardar si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --staged --quiet && exit 0
          git commit -m "chore: actualizar paneles del perfil"
          git pull --rebase origin main
          git push
